name: Test go
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Run tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
