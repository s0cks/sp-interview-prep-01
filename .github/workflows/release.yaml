name: Build and publish Go artifacts
on:
  push:
    branches:
      - main
  release:
    types:
      - published
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
  release-go-artifacts:
    name: Build go artifacts
    needs: release-please
    if: ${{ github.event_name == 'release' || needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cmd: sensor-service
            os: linux
            arch: amd64
          - cmd: sensor-service
            os: darwin
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Install Dependencies
        run: go mod download
      - name: Run tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Build ${{ matrix.service }} (${{matrix.os }}/${{ matrix.arch }})
        run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-X main.Version=${{ needs.release-please.outputs.version }} -s -w" -o bin/${{ matrix.cmd }}-${{ matrix.os }}-${{ matrix.arch }} ./cmd/${{ matrix.cmd }}
      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.version }}
          files: bin/*
  release-docker-images:
    name: Release docker images
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ github.event_name == 'release' || needs.release-please.outputs.releases_created == 'true' }}
    strategy:
      matrix:
        include:
          - service: sensor-service
            context: .
            dockerfile: ./cmd/sensor-service/Dockerfile
          - service: sensor-mock
            context: test/sensor-mock/
            dockerfile: ./test/sensor-mock/Dockerfile
          - service: sensor-web
            context: client/
            dockerfile: ./client/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ steps.release.outputs.major }}
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
