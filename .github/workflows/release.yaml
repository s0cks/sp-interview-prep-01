name: Build and publish Go artifacts
on:
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      go_tag: ${{ steps.release.outputs['._tag_name'] }}
      docker_tag: ${{ steps.release.outputs['docker_tag_name'] }}
      docker_version: ${{ steps.release.outputs['docker_version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
  release-go-artifacts:
    needs: release-please
    name: Build go artifacts
    if: ${{ needs.release-please.outputs.releases_created }} == 'true' && needs.release-please.outputs.go_tag != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cmd: sensor-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Install Dependencies
        run: go mod download
      - name: Run tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Build Sensor Service (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-X main.Version=${{ needs.release-please.outputs.go_tag }} -s -w" -o bin/${{ matrix.cmd }}-linux-amd64 ./cmd/${{ matrix.cmd }}
      - name: Build Sensor Service (darwin/amd64)
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="-X main.Version=${{ needs.release-please.outputs.go_tag }} -s -w" -o bin/${{ matrix.cmd }}-darwin-amd64 ./cmd/${{ matrix.cmd }}
      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.go_tag }}
          files: bin/*
  release-docker-images:
    name: Release docker images
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' && needs.release-please.outputs.docker_tag != '' }}
    strategy:
      matrix:
        include:
          - service: sensor-service
            context: .
            dockerfile: ./cmd/sensor-service/Dockerfile
          - service: sensor-mock
            context: .
            dockerfile: ./test/sensor-mock/Dockerfile
    steps:
      - name: login to ghcr
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ steps.release.outputs.major }}
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ steps.release.outputs.docker_version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
