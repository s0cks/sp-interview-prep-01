version: '3'
vars:
  BIN_DIR: "{{.ROOT_DIR}}/bin"
tasks:
  go:build-cmd:
    internal: false
    cmds:
      - go build -o "{{.BIN_DIR}}/{{.GO_TARGET}}" ./cmd/{{.GO_TARGET}}
  go:test:
    internal: false
    cmds:
      - go test "./internal/{{.GO_TARGET}}"
  go:run-cmd:
    internal: false
    cmds:
      - go run "./cmd/{{.GO_TARGET}}"
  build:service:
    cmds:
      - task: go:build-cmd
        vars:
          GO_TARGET: sensor-service
  build:images:
    cmds:
      - docker compose build
  test:service:
    cmds:
      - task: go:test
        vars:
          GO_TARGET: sensor
  run:service:
    cmds:
      - task: go:run-cmd
        vars:
          GO_TARGET: sensor-service
  build:
    deps:
      - build:service
      - build:images
  test:
    deps:
      - test:service
  default:
    cmds:
      - task: build
