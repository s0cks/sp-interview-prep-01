openapi: 3.0.0
info:
  title: Sensors API
  description: A minimal OpenAPI document for the managing sensor data
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local
components:
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          example: "This is an error message"
          type: string
    SensorData:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: number
          example: [1297, 1272, 192, 0]
    SensorMetric:
      type: object
      required:
        - data
      properties:
        data:
          type: number
          example: 12902.0
paths:
  /sensors:
    get:
      summary: Return a list of sensor ids
      responses:
        "200":
          description: "A list of sensor ids"
        "204":
          description: "There are no registered sensors"
  /sensors/{id}:
    post:
      summary: Ingest a value from the sensor
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the sensor
          schema:
            type: string
      responses:
        "202":
          description: "Service accepted data"
    get:
      summary: Get the values for the sensor
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the sensor
          schema:
            type: string
      responses:
        "200":
          description: A list of values for the sensor
        "204":
          description: There are no values for the sensor or the sensor doesn't exist
  /sensors/{id}/{metric}:
    get:
      summary: Get a metric for the sensor
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the sensor
          schema:
            type: string
        - name: metric
          in: path
          required: true
          description: The metric to use in calculations
          schema:
            type: string
          examples:
            average:
              summary: Get the average of the sensor data
              value: "avg"
            sum:
              summary: Get the sum of the sensor data
              value: "sum"
      responses:
        "200":
          description: The result of the metric calculation for the sensor values
        "204":
          description: There are no values for the sensor or the sensor doesn't exist
